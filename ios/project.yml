name: CinnaBookkeeping
options:
  bundleIdPrefix: com.icelemon233
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0.0"
targets:
  CinnaBookkeeping:
    type: application
    platform: iOS
    sources:
      - CinnaBookkeeping
    info:
      path: CinnaBookkeeping/Info.plist
      properties:
        CFBundleDisplayName: 肉桂卷记账
        CFBundleIdentifier: com.icelemon233.cinnabookkeeping
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icelemon233.cinnabookkeeping
        PRODUCT_NAME: CinnaBookkeeping
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
